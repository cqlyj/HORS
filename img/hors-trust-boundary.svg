<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">How HORS completes the private-agent trust boundary</title>
  <desc id="desc">Two triangles compare current approaches with HORS. Current approaches cover two of independent agents, private state, and composable functions. HORS combines all three through World human origin, ENS discovery, 0G verified execution, and per-function policy.</desc>

  <defs>
    <linearGradient id="horsBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#083d91"/>
      <stop offset="1" stop-color="#0b55d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0a3578" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1398" height="758" rx="30" fill="#fcf9f3" stroke="#dfe5ed" stroke-width="2"/>
  <path d="M700 34V726" stroke="#dfe5ed" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="42" y="48" font-size="15" font-weight="800" letter-spacing="2.2" fill="#66778d">CURRENT APPROACHES</text>
    <text x="42" y="80" font-size="25" font-weight="800" fill="#152c4a">Each covers part of the boundary</text>

    <text x="742" y="48" font-size="15" font-weight="800" letter-spacing="2.2" fill="#0b4fc7">HORS</text>
    <text x="742" y="80" font-size="25" font-weight="800" fill="#152c4a">One complete private-agent boundary</text>

    <path d="M350 184L96 642H604Z" fill="#edf2f8" fill-opacity=".45" stroke="#8092a8" stroke-width="4" stroke-linejoin="round"/>
    <path d="M1050 184L796 642H1304Z" fill="#e8f0ff" fill-opacity=".72" stroke="#0b4fc7" stroke-width="5" stroke-linejoin="round"/>

    <g text-anchor="middle">
      <text x="350" y="125" font-size="18" font-weight="850" letter-spacing="1.4" fill="#152c4a">INDEPENDENT</text>
      <text x="350" y="149" font-size="15" fill="#66778d">different wallets and vendors</text>

      <text x="96" y="682" font-size="18" font-weight="850" letter-spacing="1.4" fill="#152c4a">PRIVATE</text>
      <text x="96" y="706" font-size="15" fill="#66778d">state stays inside</text>

      <text x="604" y="682" font-size="18" font-weight="850" letter-spacing="1.4" fill="#152c4a">COMPOSABLE</text>
      <text x="604" y="706" font-size="15" fill="#66778d">functions cooperate</text>

      <text x="1050" y="125" font-size="18" font-weight="850" letter-spacing="1.4" fill="#152c4a">INDEPENDENT</text>
      <text x="1050" y="149" font-size="15" fill="#66778d">different wallets and vendors</text>

      <text x="796" y="682" font-size="18" font-weight="850" letter-spacing="1.4" fill="#152c4a">PRIVATE</text>
      <text x="796" y="706" font-size="15" fill="#66778d">state stays inside</text>

      <text x="1304" y="682" font-size="18" font-weight="850" letter-spacing="1.4" fill="#152c4a">COMPOSABLE</text>
      <text x="1304" y="706" font-size="15" fill="#66778d">functions cooperate</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="106" y="344" width="198" height="78" rx="17" fill="#fff" stroke="#cbd6e3" stroke-width="2"/>
      <rect x="396" y="344" width="198" height="78" rx="17" fill="#fff" stroke="#cbd6e3" stroke-width="2"/>
      <rect x="214" y="566" width="272" height="78" rx="17" fill="#fff" stroke="#cbd6e3" stroke-width="2"/>
    </g>

    <g text-anchor="middle">
      <text x="205" y="375" font-size="19" font-weight="800" fill="#152c4a">Full isolation</text>
      <text x="205" y="402" font-size="15" fill="#66778d">no cooperation</text>

      <text x="495" y="375" font-size="19" font-weight="800" fill="#152c4a">A2A + MCP</text>
      <text x="495" y="402" font-size="15" fill="#66778d">trust policy stays local</text>

      <text x="350" y="597" font-size="19" font-weight="800" fill="#152c4a">OAuth / smart accounts</text>
      <text x="350" y="624" font-size="15" fill="#66778d">shared authority</text>
    </g>

    <circle cx="350" cy="474" r="78" fill="#fff" stroke="#a9b6c5" stroke-width="3" stroke-dasharray="8 8"/>
    <g text-anchor="middle">
      <text x="350" y="467" font-size="18" font-weight="850" fill="#53677f">BOUNDARY</text>
      <text x="350" y="493" font-size="16" fill="#66778d">still fragmented</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="806" y="344" width="198" height="78" rx="17" fill="#fff" stroke="#72c9ae" stroke-width="2"/>
      <rect x="1096" y="344" width="198" height="78" rx="17" fill="#fff" stroke="#8fb1e2" stroke-width="2"/>
      <rect x="914" y="566" width="272" height="78" rx="17" fill="#fff" stroke="#f06a56" stroke-width="2"/>
    </g>

    <g text-anchor="middle">
      <text x="905" y="375" font-size="19" font-weight="850" fill="#152c4a">WORLD</text>
      <text x="905" y="402" font-size="15" fill="#66778d">resolve human origin</text>

      <text x="1195" y="375" font-size="19" font-weight="850" fill="#152c4a">ENS</text>
      <text x="1195" y="402" font-size="15" fill="#66778d">discover live service</text>

      <text x="1050" y="597" font-size="19" font-weight="850" fill="#152c4a">0G</text>
      <text x="1050" y="624" font-size="15" fill="#66778d">publish + verify execution</text>
    </g>

    <circle cx="1050" cy="474" r="91" fill="url(#horsBlue)" stroke="#063b94" stroke-width="3" filter="url(#shadow)"/>
    <g text-anchor="middle">
      <text x="1050" y="460" font-size="31" font-weight="900" fill="#fff">HORS</text>
      <text x="1050" y="489" font-size="16" font-weight="700" fill="#e8f1ff">per-function</text>
      <text x="1050" y="512" font-size="16" font-weight="700" fill="#e8f1ff">human-origin policy</text>
    </g>
  </g>
</svg>
