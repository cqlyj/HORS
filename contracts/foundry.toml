[profile.default]
src = "src"
out = "out"
libs = ["lib"]
script = "script"

solc = "0.8.24"
evm_version = "cancun"
auto_detect_solc = false
optimizer = true
optimizer_runs = 200

extra_output_files = ["abi"]

[rpc_endpoints]
galileo = "https://evmrpc-testnet.0g.ai"

[etherscan]
galileo = { key = "verifyContract", chain = 16602, url = "https://chainscan-galileo.0g.ai/api" }
